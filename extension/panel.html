<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TypingBot</title><link rel="stylesheet" href="panel.css"></head><body>
<header><h1>TypingBot</h1><span id="mode">Offline</span></header>
<section aria-live="polite"><h2 id="status">New session</h2><p id="reason"></p><progress id="progress" value="0" max="1"></progress><p id="metrics"></p><div class="row"><button id="resume">Run / resume</button><button id="pause">Pause</button><button id="stop">Stop</button></div><div id="recovery" hidden><p>Inspect the last action in the preview. Restore the document to its before or after state, then confirm.</p><button id="applied">Matches after</button><button id="undone">Matches before</button></div></section>
<form id="form"><label>Subject preset<select id="preset"><option>English</option><option>Social Studies</option><option>Custom</option></select></label><label>Writing brief<textarea id="brief" required maxlength="4000" placeholder="Describe the goal, audience, and target length"></textarea></label><label>Reference text<textarea id="reference" maxlength="18000" placeholder="Paste supporting material"></textarea></label><label>Source files · up to 500 MB per project<input id="files" type="file" multiple accept=".txt,.md,.pdf"></label><p id="sources"></p><button type="button" id="clearSources">Start fresh source collection</button>
<label>Paragraphs<input id="count" type="number" min="1" max="5" value="1" required></label>
<details><summary>Advanced writing settings</summary><div id="knobs"></div><label><input type="checkbox" id="revise" checked>Revisit earlier wording</label><label><input type="checkbox" id="finalReview" checked>Review the complete draft</label><label>Per-run limit (cents)<input id="runCents" type="number" min="1" max="10" value="10" required></label><label>Daily limit (cents)<input id="dayCents" type="number" min="1" max="50" value="50" required></label><button type="button" id="savePreset">Save as Custom</button><button type="button" id="fast">Accelerate for testing</button></details>
<details id="connection"><summary>Backend connection</summary><label>Local port or SSH tunnel port<input id="port" type="number" min="1" max="65535" value="4317" required></label><label>Pairing token<input id="token" type="password" autocomplete="off"></label><button type="button" id="connect">Save and test</button></details>
<button type="submit" class="primary">Generate writing plan</button></form>
<details open><summary>AI activity log</summary><ol id="log"></ol></details><details><summary>Planned edits</summary><ol id="plan"></ol></details><p role="alert" id="msg"></p><script type="module" src="panel.js"></script></body></html>
